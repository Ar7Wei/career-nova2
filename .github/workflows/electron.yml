name: Electron

on:
  push:
    branches: [main]
    paths:
      - "electron/**"
      - ".github/workflows/electron.yml"
  pull_request:
    paths:
      - "electron/**"
      - ".github/workflows/electron.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: electron

jobs:
  lint:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Install dependencies
        run: npm ci

      # electron 是 Node 项目但没有 TypeScript、也没有 lint 配置，能自动化的
      # 静态检查只有语法解析（node --check 只解析、不执行，不会碰 electron 模块）。
      # 这里刻意不装 electron：单测在本地跑，且 tests 不进公开树。
      - name: Syntax check
        run: |
          find . -name '*.js' -not -path './node_modules/*' -print0 \
            | xargs -0 -n1 node --check
