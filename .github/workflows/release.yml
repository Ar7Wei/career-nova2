name: Release

# 触发：main 上 package.json（版本号真相源）有改动 → 打包发版。
# 产物落 GitHub Release，由 CI 自己建 tag——不再需要手打 tag。
on:
  push:
    branches: [main]
    paths:
      - "package.json"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（不含 v 前缀），如 0.1.1。留空 = 只校验、不发版"
        required: false
        default: ""
      create_release:
        description: "勾选 = 建正式 Release（干跑请勿勾选）"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # 质量门：发版前先定型。backend(ruff+mypy) + frontend(typecheck+lint+build)
  # + electron(node --check) 三源质量项顺序跑（ubuntu，一个 job 省 runner——发版频率低，
  # 几分钟可接受）。挂了直接终止，release job 不会跑——「质量不过不打包」。
  # 日常非发版 push 的质量保护仍由 backend/frontend/electron.yml 各自 paths 触发管，
  # 与本流程分工：它们管日常，这条管发版前的总闸。
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      # backend：只装 dev 组（ruff/mypy）。test 组刻意不装：开源树不含测试文件。
      - name: Backend deps
        run: uv sync --frozen --group dev

      - name: Backend ruff
        run: uv run ruff check .

      - name: Backend mypy
        run: uv run mypy .

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            electron/package-lock.json

      # frontend：typecheck + lint + build（与 frontend.yml 同源）。
      - name: Frontend deps
        working-directory: frontend
        run: npm ci

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      # electron：无 TS/lint 配置，自动化的静态检查只有语法解析
      # （node --check 只解析不执行，不碰 electron 模块）。
      - name: Electron deps
        working-directory: electron
        run: npm ci

      - name: Electron syntax check
        working-directory: electron
        run: |
          find . -name '*.js' -not -path './node_modules/*' -print0 \
            | xargs -0 -n1 node --check

  release:
    name: Build & release
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # 版本号唯一真相源 = 根 package.json（ADR 0022）。这条命令把 tag 名的 v 前缀剥掉，
      # 交给下面的同步脚本分发到四个消费点。
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $v = ""
          if ("${{ inputs.version }}" -ne "") {
            $v = "${{ inputs.version }}"
          } else {
            $json = Get-Content package.json -Raw | ConvertFrom-Json
            $v = $json.version
          }
          $v = $v.TrimStart("v")
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "版本号格式不对: $v（要求 x.y.z）" }
          "value=$v" >> $env:GITHUB_OUTPUT
          Write-Host "版本号 = $v"

      # 幂等闸门：Release 已存在说明这版发过了，直接放行不做事。
      # 这条是「push 触发」能安全重放的关键——不然每次动 package.json 都会撞 already exists。
      # 判据用 Release 而不是 tag：若打包成功、tag 已推但建 Release 那步挂了，
      # 远程会剩个孤儿 tag。只看 tag 就会永远跳过、再也修不了；只看 Release
      # 则下次重跑会重新构建并把 Release 补上（tag 那步做成幂等，见最后一步）。
      - name: Skip if already released
        id: gate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.version.outputs.value }}"
          gh release view $tag --json tagName 2>$null | Out-Null
          # ⚠️ 先把结果存进布尔量，再显式把 $LASTEXITCODE 归零。
          # 原因：Release 不存在时 gh 返回 1，而 PowerShell 的 if/else 不会重置
          # $LASTEXITCODE——runner 会在脚本末尾追加
          # `if ((Test-Path variable:\LASTEXITCODE)) { exit $LASTEXITCODE }`，
          # 于是那个 1 会被当成整步的退出码，明明该「继续打包」却判失败。
          $exists = ($LASTEXITCODE -eq 0)
          $LASTEXITCODE = 0
          if ($exists) {
            Write-Host "::$tag 的 Release 已存在，跳过打包"
            "skip=true" >> $env:GITHUB_OUTPUT
          } else {
            "skip=false" >> $env:GITHUB_OUTPUT
          }

      - name: Setup Node
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            electron/package-lock.json

      # 版本号分发：以根 package.json 为源，写进 electron/package.json（electron-builder
      # 构建时读）、app/core/config.py（后端运行时读 /health）、frontend/package.json、
      # pyproject.toml。改的是**工作区**里的源码——PyInstaller 随后冻结这份，版本号才进得了产物。
      - name: Sync version to consumers
        if: steps.gate.outputs.skip != 'true'
        run: node scripts/sync-version.mjs ${{ steps.version.outputs.value }}

      - name: Install uv
        if: steps.gate.outputs.skip != 'true'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python
        if: steps.gate.outputs.skip != 'true'
        run: uv python install

      # 只装 dev 组（含 pyinstaller）。test 组刻意不装：开源树不含测试文件（ADR 0021）。
      - name: Sync backend dependencies
        if: steps.gate.outputs.skip != 'true'
        run: uv sync --frozen --group dev

      - name: Build backend (PyInstaller onedir)
        if: steps.gate.outputs.skip != 'true'
        run: uv run pyinstaller backend.spec --clean

      - name: Build frontend
        if: steps.gate.outputs.skip != 'true'
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # electron 依赖要在 winCodeSign 预置之前装好——预置步骤要用它自带的 7za.exe。
      - name: Install electron dependencies
        if: steps.gate.outputs.skip != 'true'
        working-directory: electron
        run: npm ci

      # electron-builder 改 exe 资源（图标/版本/asar 完整性）必须用 winCodeSign 里的 rcedit，
      # 所以这个下载绕不开——noop 签名脚本只能跳过「签名」那一步，拦不住下载。
      # winCodeSign 包里带 darwin/linux 的符号链接（给 mac/linux 签名用），默认解压需要
      # SeCreateSymbolicLinkPrivilege，CI runner 没有 → 7-Zip 报错、electron-builder 重试到崩。
      # 解法：自己下载 + `-snl-`（关符号链接，那些文件 Windows 打包根本用不到）解压到
      # electron-builder 预期的规范名目录，它会直接认这个缓存、不再下载。
      # 不用 actions/cache：现场解压约 1 秒，且免掉「缓存未命中就撞坑」的失败模式。
      - name: Pre-seed winCodeSign cache
        if: steps.gate.outputs.skip != 'true'
        shell: pwsh
        run: |
          $cache = "$env:LOCALAPPDATA\electron-builder\Cache\winCodeSign"
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          $archive = "$cache\winCodeSign-2.6.0.7z"
          Invoke-WebRequest -Uri "https://github.com/electron-userland/electron-builder-binaries/releases/download/winCodeSign-2.6.0/winCodeSign-2.6.0.7z" -OutFile $archive
          & "electron\node_modules\7zip-bin\win\x64\7za.exe" x $archive "-o$cache\winCodeSign-2.6.0" -snl- -bd
          if ($LASTEXITCODE -ne 0) { throw "winCodeSign 解压失败" }
          Remove-Item $archive
          Write-Host "已预置: $cache\winCodeSign-2.6.0"

      - name: Build installer (electron-builder)
        if: steps.gate.outputs.skip != 'true'
        working-directory: electron
        run: npm run build

      - name: Collect artifacts
        if: steps.gate.outputs.skip != 'true'
        shell: pwsh
        run: |
          Get-ChildItem dist/installer -File | ForEach-Object {
            Write-Host ("{0}  ({1:N1} MB)" -f $_.Name, ($_.Length / 1MB))
          }

      - name: Upload artifacts
        if: steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: career-nova2-${{ steps.version.outputs.value }}-windows
          # 显式只收这两个产物，**不用 `*.exe` 通配**：electron-builder 会在同目录留
          # `__uninstaller-nsis-*.exe` 之类的中间文件，通配会把它们一起收进来。
          # 文件名模板在 electron/package.json 的 artifactName（NSIS 一个、portable 一个）。
          # 不带 *.blockmap——那是给自动更新做差分的，本应用用不上。
          path: |
            dist/installer/Career-Nova2-Setup-*.exe
            dist/installer/Career-Nova2-[0-9]*.exe
          if-no-files-found: error

      # 打 tag + 建 Release。tag 在**构建成功之后**才推——若前面任何一步失败，
      # 远程不留孤儿 tag，幂等闸门下次就会重跑（否则失败一次就永远修不了）。
      - name: Create tag & release
        if: (github.event_name == 'push' || inputs.create_release) && steps.gate.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.version.outputs.value }}"
          $tag = "v$v"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 幂等：恰好被上次「建 tag 成功但建 Release 失败」留下的孤儿 tag，这里就地补上。
          # ⚠️ 同样先存布尔量再归零 $LASTEXITCODE（tag 不存在时 ls-remote 返回非零，
          #    会被 runner 追加的 `exit $LASTEXITCODE` 当成整步失败）。
          $tagExists = [bool](git ls-remote --tags origin "refs/tags/$tag")
          $LASTEXITCODE = 0
          if ($tagExists) {
            git tag -d $tag 2>$null
            git fetch --depth=1 origin "refs/tags/$tag`:refs/tags/$tag"
            Write-Host "$tag 已存在，复用"
          } else {
            git tag -a $tag -m "Career Nova2 $tag"
            git push origin $tag
          }
          # 只挂 NSIS + Portable 两个 exe；blockmap/builder-debug.yml 不上 Release。
          # 显式按前缀收，**不用 `*.exe` 通配**——同目录可能留 `__uninstaller-nsis-*.exe`
          # （electron-builder 的中间产物，不该发给用户）。
          # ⚠️ 传给原生命令必须用 @assets 展开：直接 $assets 会把所有路径拼成
          # 一个空格分隔的参数（gh 当成单个文件名），多文件时必炸。
          $assets = @(
            Get-ChildItem dist/installer -File -Filter "Career-Nova2-*.exe" |
              Where-Object { $_.Name -notlike "__uninstaller*" } |
              ForEach-Object { $_.FullName }
          )
          if ($assets.Count -eq 0) { throw "dist/installer 下没有产物" }
          Write-Host "将上传 $($assets.Count) 个文件:"
          $assets | ForEach-Object { Write-Host "  $_" }
          gh release create $tag `
            --title "Career Nova2 $tag" `
            --generate-notes `
            @assets
