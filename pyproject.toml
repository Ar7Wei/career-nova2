[project]
name = "career-nova"
version = "0.1.1"
description = "Career Nova v2 — 本地优先、单用户的求职桌面应用后端"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.121.0",
    "uvicorn>=0.34.0",
    "langchain>=1.0.5",
    "langchain-core>=1.0.4",
    "langchain-openai>=1.0.2",
    "langgraph>=1.0.2",
    "sqlmodel>=0.0.25",
    "aiosqlite>=0.20.0",
    "sqlite-vec>=0.1.6",
    "pydantic>=2.11.1",
    "pydantic-settings>=2.8.1",
    "python-dotenv>=1.1.0",
    "python-multipart>=0.0.20",
    "structlog>=25.2.0",
    "tenacity>=9.1.2",
    "rich>=13.9.4",
    "markitdown[docx,pdf,pptx,xlsx]>=0.1.7",
    "curl-cffi>=0.16.0",
    "jinja2>=3.1.6",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "deepagents>=0.7.13",
]

[dependency-groups]
dev = [
    "ruff>=0.11.4",
    "mypy>=1.15.0",
    "pyinstaller>=6.22.3",
]
test = [
    "httpx>=0.28.1",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
python_files = ["test_*.py", "*_test.py", "tests.py"]
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]

[tool.ruff]
line-length = 119
exclude = ["*.ipynb", ".venv", "data", "node_modules", "frontend", "electron"]

[tool.ruff.lint]
select = ["E", "F", "B", "ERA", "D"]
# D415 对中文句读"。"识别不佳，中文项目忽略；E501 行长交给编辑器
ignore = ["E501", "D203", "D213", "B904", "B008", "D415"]
unfixable = ["B"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "D104"]
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.13"
packages = ["app"]
ignore_missing_imports = true
exclude = ["tests", ".venv"]
plugins = ["pydantic.mypy"]
